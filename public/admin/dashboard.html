<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    /* To avoid folder picker overflow hidden inside container */
    #folder-picker {
      max-height: 256px;
      overflow-y: auto;
    }
  </style>
</head>
<body x-data="dashboard()" x-init="init()" class="bg-gray-100">

  <!-- Mobile Header -->
  <header class="md:hidden fixed top-0 left-0 right-0 bg-white p-4 shadow z-40 flex justify-between items-center">
    <h1 class="text-xl font-semibold text-indigo-600">Admin Panel</h1>
    <button @click="sidebarOpen = !sidebarOpen" class="text-gray-600 focus:outline-none">
      <!-- Hamburger Icon -->
      <svg x-show="!sidebarOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
           viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <!-- Close Icon -->
      <svg x-show="sidebarOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
           viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </header>

  <!-- Sidebar -->
  <aside
    class="fixed top-0 left-0 h-screen w-64 bg-white shadow-lg p-6 z-50 transform transition-transform duration-200 ease-in-out md:translate-x-0"
    :class="{ '-translate-x-full': !sidebarOpen }"
    x-show="sidebarOpen || window.innerWidth >= 768"
    @resize.window="sidebarOpen = window.innerWidth >= 768"
    @click.outside="if(window.innerWidth < 768) sidebarOpen = false"
  >
    <h2 class="text-2xl font-bold mb-6 text-indigo-600">Admin Panel</h2>
    <nav class="flex flex-col space-y-3">
  <button @click="changeView('dashboard')" :class="navClass('dashboard')">Upload File</button>
  <button @click="changeView('users')" :class="navClass('users')">Directory</button>
  <button @click="window.location.href = '/nas/media/view'">Views</button>
  <button @click="changeView('about')" :class="navClass('about')">About</button>
    </nav>
    <div class="mt-auto text-xs text-gray-400 pt-6">
      &copy; 2025 Your Company
    </div>
  </aside>

  <!-- Main Content -->
  <div class="ml-0 md:ml-64 flex flex-col min-h-screen pt-16 md:pt-0">
    <main class="flex-1 overflow-y-auto p-8 pb-24">
      <!-- Dashboard -->
      <template x-if="currentView === 'dashboard'">
        <section>
          <div class="max-w-3xl mx-auto py-10 px-4" x-data="uploadExplorer($root)" x-init="init()">

            <!-- Upload Form -->
            <div class="bg-white p-6 rounded shadow mb-6 relative">


              <!-- Loading Overlay -->
              <template x-if="uploading">
                <div class="absolute inset-0 bg-white bg-opacity-80 flex flex-col items-center justify-center z-30 rounded">
                  <svg class="animate-spin h-10 w-10 text-blue-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                  </svg>
                  <span class="text-blue-700 font-semibold text-lg">Uploading...</span>
                </div>
              </template>

              <h2 class="text-xl font-semibold mb-4">Upload a File</h2>

              <!-- Select Folder -->
              <div class="mb-4 relative">
                <button
                  class="text-sm text-blue-600 hover:underline"
                  @click="showFolderPicker = !showFolderPicker"
                  type="button"
                >
                  📁 Select Folder
                </button>
                <p class="text-gray-600 mt-2 text-sm">
                  Selected Folder:
                  <span class="font-medium text-gray-800" x-text="selectedFolder || 'None'"></span>
                </p>

                <!-- Folder Picker Dropdown -->
                <div
                  id="folder-picker"
                  class="border mt-2 rounded p-2 bg-white shadow-md absolute z-20 w-full"
                  x-show="showFolderPicker"
                  @click.outside="showFolderPicker = false"
                  x-transition
                  style="display: none;"
                >
                  <template x-if="treeData && treeData.contents && treeData.contents.length > 0">
                    <div class="ml-2">
                      <template x-for="folder in treeData.contents" :key="folder.name">
                        <div x-show="folder.type === 'directory'">
                          <div x-data="folderItem(folder, '', $data)">
                            <div class="mt-1">
                              <div class="flex items-center space-x-1">
                                <button 
                                  x-show="hasChildren" 
                                  type="button" 
                                  @click="expanded = !expanded"
                                  class="focus:outline-none">
                                  <span x-text="expanded ? '▼' : '▶'"></span>
                                </button>
                                <span x-show="!hasChildren" class="w-4"></span>
                                <button 
                                  type="button"
                                  @click="selectFolder()"
                                  :class="{'text-blue-600 underline font-semibold': isSelected, 'text-gray-800 hover:text-blue-600': !isSelected}"
                                  class="ml-1">
                                  📁 <span x-text="folder.name"></span>
                                </button>
                              </div>
                              <div 
                                x-show="expanded && hasChildren" 
                                class="ml-6 border-l border-gray-300 pl-2 mt-1"
                                x-transition>
                                <template x-for="child in folder.contents" :key="child.name">
                                  <div x-show="child.type === 'directory'">
                                    <div x-data="folderItem(child, fullPath, rootData)">
                                      <div class="mt-1">
                                        <div class="flex items-center space-x-1">
                                          <button 
                                            x-show="hasChildren" 
                                            type="button" 
                                            @click="expanded = !expanded"
                                            class="focus:outline-none">
                                            <span x-text="expanded ? '▼' : '▶'"></span>
                                          </button>
                                          <span x-show="!hasChildren" class="w-4"></span>
                                          <button 
                                            type="button"
                                            @click="selectFolder()"
                                            :class="{'text-blue-600 underline font-semibold': isSelected, 'text-gray-800 hover:text-blue-600': !isSelected}"
                                            class="ml-1">
                                            📁 <span x-text="child.name"></span>
                                          </button>
                                        </div>
                                        <div 
                                          x-show="expanded && hasChildren" 
                                          class="ml-6 border-l border-gray-300 pl-2 mt-1"
                                          x-transition>
                                          <template x-for="grandChild in child.contents" :key="grandChild.name">
                                            <div x-show="grandChild.type === 'directory'">
                                              <div x-data="folderItem(grandChild, fullPath, rootData)">
                                                <div class="mt-1">
                                                  <div class="flex items-center space-x-1">
                                                    <span class="w-4"></span>
                                                    <button 
                                                      type="button"
                                                      @click="selectFolder()"
                                                      :class="{'text-blue-600 underline font-semibold': isSelected, 'text-gray-800 hover:text-blue-600': !isSelected}"
                                                      class="ml-1">
                                                      📁 <span x-text="grandChild.name"></span>
                                                    </button>
                                                  </div>
                                                </div>
                                              </div>
                                            </div>
                                          </template>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </template>
                              </div>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="!treeData">
                    <p class="text-gray-500 text-center">Loading folders...</p>
                  </template>
                  <template x-if="treeData && (!treeData.contents || treeData.contents.length === 0)">
                    <p class="text-gray-500 text-center">No folders available</p>
                  </template>
                </div>
              </div>

              <!-- File Picker -->
              <div class="mb-4">
                <input type="file" @change="onFileChange($event)" />
              </div>

              <!-- Drag and Drop File Picker -->
              <div
                @dragover.prevent="dragOver = true"
                @dragleave.prevent="dragOver = false"
                @drop.prevent="handleDrop($event)"
                :class="dragOver ? 'border-blue-500 bg-blue-50' : 'border-gray-300 bg-white'"
                class="mb-4 flex items-center justify-center border-2 border-dashed rounded cursor-pointer h-32 text-gray-500 transition-colors"
                tabindex="0"
                @keydown.enter="$refs.fileInput.click()"
                @keydown.space="$refs.fileInput.click()"
              >
                <div>
                  <p class="text-center">Drag & drop a file here</p>
                  <p class="text-xs text-gray-400 mt-1">Supported types: images, videos, glb</p>
                </div>
                <input
                  type="file"
                  @change="onFileChange($event)"
                  class="hidden"
                  x-ref="fileInput"
                />
              </div>
              
              <!-- Upload Button -->
             
<button
  class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:opacity-50 flex items-center space-x-2"
  :disabled="!selectedFolder || !fileToUpload || uploading"
  @click="uploadFile"
  type="button"
>
  <template x-if="!uploading">
    <span>Upload</span>
  </template>
  <template x-if="uploading">
    <div class="flex items-center space-x-2">
      <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
      <span>Uploading...</span>
    </div>
  </template>
</button>
            </div>

            <!-- File Preview -->
            <div class="bg-white p-6 rounded shadow">
              <h3 class="text-md font-semibold mb-2">Preview</h3>

              <template x-if="localFilePreview && isImage()">
                <img :src="localFilePreview" class="max-w-full max-h-[400px] border rounded shadow" />
              </template>

              <template x-if="localFilePreview && isVideo()">
                <video :src="localFilePreview" controls class="max-w-full max-h-[400px] border rounded shadow"></video>
              </template>

              <template x-if="localFilePreview && isGLB()">
                <model-viewer
                  :src="localFilePreview"
                  auto-rotate
                  camera-controls
                  background-color="#fff"
                  class="w-full h-[400px] border rounded shadow"
                ></model-viewer>
              </template>

              <template x-if="!localFilePreview">
                <p class="text-gray-500">No file selected.</p>
              </template>
            </div>

          </div>
        </section>
      </template>

      <!-- Users -->
     
<template x-if="currentView === 'users'">
  <section x-data="directoryManager()" x-init="init()" class="max-w-xl mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4">📁 Create New Folder</h2>

    <div class="mt-4">
      <label class="block mb-1 font-medium text-sm">New Folder Path</label>
      <input type="text" x-model="newFolderPath" placeholder="e.g. img/my-album"
             class="border px-2 py-1 rounded w-full text-sm mb-2" />

      <button @click="makeDirectory"
              class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">
        ➕ Create Folder
      </button>
    </div>

    <div class="mt-8">
      <h3 class="text-md font-semibold mb-2">📂 Folder Structure</h3>

      <template x-if="!folderTree">
        <p class="text-gray-500">Loading folders...</p>
      </template>

      <div x-show="folderTree">
        <ul class="text-sm leading-6">
          <template x-for="node in folderTree.contents" :key="node.name">
            <li>
              <div x-data="folderNode(node, '')">
                <template x-if="node.type === 'directory'">
                  <div>
                    <div class="flex items-center space-x-1 cursor-pointer" @click="toggle()">
                      <span x-text="expanded ? '▼' : '▶'" class="w-4"></span>
                      <span class="font-medium" x-text="node.name"></span>
                      <button @click.stop="deleteDir()" title="Delete folder" class="ml-2 text-red-500 hover:text-red-700 text-xs px-1 py-0.5 border border-red-200 rounded">🗑️</button>
                    </div>
                    <ul x-show="expanded" class="ml-5 mt-1 border-l border-gray-200 pl-2">
                      <template x-for="child in node.contents" :key="child.name">
                        <li>
                          <div x-data="folderNode(child, fullPath)">
                            <template x-if="child.type === 'directory'">
                              <div>
                                <div class="flex items-center space-x-1 cursor-pointer" @click="toggle()">
                                  <span x-text="expanded ? '▼' : '▶'" class="w-4"></span>
                                  <span class="font-medium" x-text="child.name"></span>
                                  <button @click.stop="deleteDir()" title="Delete folder" class="ml-2 text-red-500 hover:text-red-700 text-xs px-1 py-0.5 border border-red-200 rounded">🗑️</button>
                                </div>
                                <ul x-show="expanded" class="ml-5 mt-1 border-l border-gray-200 pl-2">
                                  <template x-for="grandChild in child.contents" :key="grandChild.name">
                                    <li>
                                      <div x-data="folderNode(grandChild, fullPath)">
                                        <template x-if="grandChild.type === 'directory'">
                                          <div class="flex items-center space-x-1">
                                            <span class="w-4"></span>
                                            <span class="font-medium" x-text="grandChild.name"></span>
                                            <button @click.stop="deleteDir()" title="Delete folder" class="ml-2 text-red-500 hover:text-red-700 text-xs px-1 py-0.5 border border-red-200 rounded">🗑️</button>
                                          </div>
                                        </template>
                                        <template x-if="grandChild.type === 'file'">
                                          <span>📄 <span x-text="grandChild.name"></span></span>
                                        </template>
                                      </div>
                                    </li>
                                  </template>
                                </ul>
                              </div>
                            </template>
                            <template x-if="child.type === 'file'">
                              <span>📄 <span x-text="child.name"></span></span>
                            </template>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>
            </li>
          </template>
        </ul>
      </div>
    </div>
  </section>
</template>
      <!-- Settings -->
      <template x-if="currentView === 'settings'">
        <section class="max-w-md">
          <h1 class="text-3xl font-bold mb-4">Settings</h1>
          <form class="space-y-4">
            <div>
              <label class="block font-semibold">Email Notifications</label>
              <input type="checkbox" x-model="settings.emailNotifications" class="mr-2">
              Enable email notifications
            </div>
            <div>
              <label class="block font-semibold">Auto Updates</label>
              <input type="checkbox" x-model="settings.autoUpdates" class="mr-2">
              Enable automatic updates
            </div>
            <div>
              <label class="block font-semibold">Timezone</label>
              <select x-model="settings.timezone" class="w-full border rounded px-2 py-1">
                <option value="UTC">UTC</option>
                <option value="PST">PST</option>
                <option value="EST">EST</option>
              </select>
            </div>
            <button @click.prevent="saveSettings"
              class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Save</button>
          </form>
        </section>
      </template>

      <!-- About -->
      <template x-if="currentView === 'about'">
        <section>
          <h1 class="text-3xl font-bold mb-4">About</h1>
          <p>This is a simple admin panel built with Tailwind CSS and Alpine.js.</p>
        </section>
      </template>
    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 left-0 md:left-64 right-0 bg-white p-4 text-center text-sm text-gray-500 shadow-inner z-40">
      &copy; 2025 Your Company. All rights reserved.
    </footer>
  </div>

  <!-- Alpine.js Component -->
  
<script>

  function folderNode(node, basePath) {
    return {
      node,
      expanded: false,
      fullPath: basePath ? `${basePath}/${node.name}` : node.name,

      toggle() {
        this.expanded = !this.expanded;
      },

      deleteDir() {
        if (window.directoryManagerRef && typeof window.directoryManagerRef.deleteDirectory === 'function') {
          window.directoryManagerRef.deleteDirectory(this.fullPath);
        }
      }
    }
  }
</script>
  <script src="script.js"></script>
</body>
</html>
